name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "43 3 * * *" # nightly: the soak job
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 30
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_URL: postgres://test:test@127.0.0.1:5432/test
      MYSQL_URL: mysql://test:test@127.0.0.1:3306/test
      MONGO_URL: mongodb://127.0.0.1:27017
      # An unreachable server fails the run instead of silently skipping the live-engine suites.
      REQUIRE_LIVE_DBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known-vulnerable dependencies fail the build (production dependencies; dev tooling is audited
      # weekly by the scheduled job below).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run typecheck
      # The full suite, live engines included — the pre-commit hook excludes them, so this is the only
      # place they gate anything.
      # The github-actions reporter turns each failing test into a check annotation, readable through the
      # API, where the job log is buried under the service containers' shutdown output.
      - run: pnpm exec vitest run --coverage --coverage.reporter=text --reporter=default --reporter=github-actions
      - run: pnpm run build

  # Deeper, slower checks than every push needs: every dependency audited, and the property-based
  # migration suites run far longer than their per-push default, against the same real engines.
  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 30
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_URL: postgres://test:test@127.0.0.1:5432/test
      MYSQL_URL: mysql://test:test@127.0.0.1:3306/test
      MONGO_URL: mongodb://127.0.0.1:27017
      REQUIRE_LIVE_DBS: "1"
      PROPERTY_RUNS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm exec vitest run src/migrations/property.test.ts src/migrations/crash.test.ts --reporter=default --reporter=github-actions

  # Mutation testing of the migration core: too slow for every push (hours), so nightly. The report
  # (reports/mutation/index.html) lists every mutant the tests didn't notice.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
